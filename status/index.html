<!doctype html>
<html lang="en" style="color-scheme: dark; background: #0b0b0b">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude quota</title>
<style>
  .viz-root {
    color-scheme: dark;
    --page: #0b0b0b;
    --surface-1: #1a1a19;
    --surface-2: #232321;
    --border: #2c2c2a;
    --grid: #262624;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #8b8a83;
    --pool: #d95926;
    --series-1: #3987e5;
    --series-2: #199e70;
    --series-3: #c98500;
    --warn: #e09a3e;
    --crit: #e66767;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .viz-root {
    min-height: 100vh; background: var(--page); color: var(--text-primary);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px; font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 16px; }
  .panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 16px; padding: 22px 24px; }
  .title { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; }
  .title .sub { color: var(--text-muted); font-weight: 400; }
  .title svg { color: var(--pool); }
  .hero { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 2px; }
  .hero .big { font-size: 56px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
  .hero .of { color: var(--text-muted); font-size: 18px; }
  .controls { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 2px; }
  .seg button { border: 0; background: none; color: var(--text-secondary); font: inherit; padding: 4px 12px; border-radius: 6px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--surface-1); color: var(--text-primary); box-shadow: 0 0 0 1px var(--border); }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .legend { display: flex; gap: 22px; align-items: center; color: var(--text-secondary); margin-top: 6px; flex-wrap: wrap; }
  .legend .key { display: inline-flex; align-items: center; gap: 8px; }
  .legend .name { color: var(--text-primary); margin-right: 18px; }
  .axis text { fill: var(--text-muted); font-size: 12px; }
  .tip {
    position: absolute; pointer-events: none; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 10px; font-size: 12px; min-width: 170px; display: none; z-index: 2;
    box-shadow: 0 6px 20px rgb(0 0 0 / 0.25);
  }
  .tip .when { color: var(--text-muted); margin-bottom: 4px; }
  .tip .row { display: flex; justify-content: space-between; gap: 14px; }
  .tip .row span:first-child { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); }
  .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .card h3 { margin: 0; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .card h3 .em { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .card h3 .status { flex: none; margin-left: auto; }
  .card .val { font-size: 32px; font-weight: 700; margin: 6px 0 2px; }
  .card .val small { font-size: 14px; color: var(--text-muted); font-weight: 400; }
  .meter { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; position: relative; margin: 10px 0 2px; }
  .meter i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
  .status { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
  .status.warn { color: var(--warn); } .status.crit { color: var(--crit); }
  .threads .title { margin-bottom: 10px; }
  .threads table { width: 100%; border-collapse: collapse; }
  .threads th { text-align: left; font-weight: 400; color: var(--text-muted); font-size: 12px; padding: 0 10px 6px 0; }
  .threads td { padding: 7px 10px 7px 0; border-top: 1px solid var(--grid); white-space: nowrap; }
  .threads td.num, .threads th.num { text-align: right; }
  .threads .id { font-family: ui-monospace, monospace; font-size: 12px; color: var(--text-secondary); }
  .threads .acct { display: inline-flex; align-items: center; gap: 6px; }
  .threads .muted, .threads .ago { color: var(--text-muted); }
  .threads .move { color: var(--warn); font-size: 12px; }
  .threads tr.idle td:not(.ago) { color: var(--text-muted); }
  .threads .empty { color: var(--text-muted); padding: 6px 0; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--surface-2); margin-right: 2px; }
  .dot.live { background: var(--series-2); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
</style>
</head>
<body>
<div class="viz-root">
<div class="wrap">
  <section class="panel">
    <div class="title">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><g stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M12 2v20M2 12h20M4.9 4.9l14.2 14.2M19.1 4.9 4.9 19.1M7 2.8l10 18.4M17 2.8 7 21.2"/></g></svg>
      Claude <span class="sub" id="acct-count"></span>
    </div>
    <div class="hero"><span class="big" id="hero">–</span><span class="of" id="hero-of"></span></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="History range">
        <button data-days="3">3D</button><button data-days="7">7D</button><button data-days="14">14D</button>
      </div>
    </div>
    <div class="chart" id="pool-chart"></div>
    <div class="legend">
      <span class="name">Pool</span>
      <span class="key"><svg width="26" height="4"><line x1="0" y1="2" x2="26" y2="2" stroke="var(--pool)" stroke-width="2.5"/></svg>Recorded</span>
      <span class="key"><svg width="26" height="4"><line x1="0" y1="2" x2="26" y2="2" stroke="var(--pool)" stroke-width="2.5" stroke-dasharray="1 4" stroke-linecap="round"/></svg>Estimated from logs</span>
      <span class="key"><svg width="26" height="4"><line x1="0" y1="2" x2="26" y2="2" stroke="var(--pool)" stroke-width="2" stroke-dasharray="6 4"/></svg>Projected</span>
    </div>
  </section>

  <section class="cards" id="cards"></section>

  <section class="panel threads">
    <div class="title">Threads <span class="sub" id="threads-sub"></span></div>
    <div id="threads"></div>
  </section>

</div>
</div>

<script>
const COLORS = ["var(--series-1)", "var(--series-2)", "var(--series-3)"];
const DAY = 86400;
let data = null;
let days = Number(localStorage.getItem("days") || 7);
let hoverT = null;

const $ = (id) => document.getElementById(id);
const fmtPct = (v) => (v == null ? "–" : `${Math.round(v)}%`);
const short = (email) => email.split("@")[0];
const fmtWhen = (t) => new Date(t * 1000).toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
function fmtIn(sec) {
  if (sec <= 0) return "now";
  const d = Math.floor(sec / DAY), h = Math.floor((sec % DAY) / 3600), m = Math.floor((sec % 3600) / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
}
const el = (tag, attrs = {}) => {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
};

async function load() {
  try {
    const res = await fetch("api/data");
    data = await res.json();
  } catch {
    setTimeout(load, 2000); // server still starting
    return;
  }
  render();
}

// history points [{t, v, kind}] plus projected [{t, v}], for one series
function seriesFor(key) {
  const hist = [], proj = [];
  const vals = key === "pool" ? data.pool : data.series[key].remaining;
  const kinds = key === "pool" ? data.pool_kind : data.series[key].kind;
  data.grid.forEach((t, i) => { if (vals[i] != null) hist.push({ t, v: vals[i], kind: kinds[i] }); });
  const p = data.projection;
  if (p) {
    const pv = key === "pool" ? p.pool : p.accounts[key];
    if (pv) p.t.forEach((t, i) => proj.push({ t, v: pv[i] }));
  }
  return { hist, proj };
}

function domain() {
  const now = data.now;
  return [now - days * DAY, now + Math.max(3, days / 2) * DAY];
}

function jumps(points, minDelta) {
  const out = [];
  for (let i = 1; i < points.length; i++) {
    // a reset shows as a rise within ~an hour; merge consecutive rising steps
    let j = i, gain = 0;
    while (j < points.length && points[j].v > points[j - 1].v && points[j].t - points[i - 1].t <= 3600) { gain += points[j].v - points[j - 1].v; j++; }
    if (gain >= minDelta) { out.push({ t: points[j - 1].t, v: points[j - 1].v, gain }); i = j - 1; }
  }
  return out;
}

function drawChart(container, { key, height, max, color, area, labels, ticksY, mini }) {
  container.innerHTML = "";
  const W = container.clientWidth, H = height;
  const m = mini ? { l: 36, r: 8, t: 10, b: 20 } : { l: 52, r: 12, t: 30, b: 28 };
  const [x0, x1] = domain();
  const X = (t) => m.l + ((t - x0) / (x1 - x0)) * (W - m.l - m.r);
  const Y = (v) => m.t + (1 - v / max) * (H - m.t - m.b);
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": `${key} remaining quota over time` });
  const defs = el("defs");
  const gid = `g-${key.replace(/\W/g, "")}`;
  const grad = el("linearGradient", { id: gid, x1: 0, y1: 0, x2: 0, y2: 1 });
  grad.append(el("stop", { offset: "0", "stop-color": color, "stop-opacity": mini ? 0.18 : 0.28 }));
  grad.append(el("stop", { offset: "1", "stop-color": color, "stop-opacity": 0 }));
  defs.append(grad);
  const clip = el("clipPath", { id: `${gid}-clip` });
  clip.append(el("rect", { x: m.l, y: 0, width: W - m.l - m.r, height: H }));
  defs.append(clip);
  svg.append(defs);

  // grid + y axis
  const axis = el("g", { class: "axis" });
  for (const v of ticksY) {
    axis.append(el("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: "var(--grid)", "stroke-width": 1 }));
    const tx = el("text", { x: m.l - 8, y: Y(v) + 4, "text-anchor": "end" }); tx.textContent = `${v}%`; axis.append(tx);
  }
  // day ticks
  const d0 = new Date(x0 * 1000); d0.setHours(0, 0, 0, 0);
  const stepDays = (x1 - x0) / DAY > 12 ? 2 : 1;
  for (let d = new Date(d0); d.getTime() / 1000 <= x1; d.setDate(d.getDate() + stepDays)) {
    const t = d.getTime() / 1000; if (t < x0) continue;
    const labelFits = X(t + DAY * stepDays / 2) < W - m.r - 16;
    axis.append(el("line", { x1: X(t), x2: X(t), y1: m.t, y2: H - m.b, stroke: "var(--grid)", "stroke-width": 1 }));
    if (labelFits && (!mini || stepDays === 1 && (x1 - x0) / DAY <= 8)) {
      const tx = el("text", { x: X(t + DAY * stepDays / 2), y: H - 6, "text-anchor": "middle" });
      tx.textContent = d.toLocaleDateString(undefined, mini ? { weekday: "narrow" } : { weekday: "short", day: "numeric" });
      axis.append(tx);
    }
  }
  svg.append(axis);

  const { hist, proj } = seriesFor(key);
  const vis = hist.filter((p) => p.t >= x0 - data.step);
  const plot = el("g", { "clip-path": `url(#${gid}-clip)` });
  const path = (pts) => pts.map((p, i) => `${i ? "L" : "M"}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join("");
  if (area && vis.length) {
    const all = vis.concat(proj.slice(1));
    plot.append(el("path", { d: `${path(all)}L${X(all.at(-1).t)},${Y(0)}L${X(all[0].t)},${Y(0)}Z`, fill: `url(#${gid})` }));
  }
  // split history into recorded / estimated runs
  let run = [];
  const flush = () => {
    if (run.length > 1) plot.append(el("path", {
      d: path(run), fill: "none", stroke: color, "stroke-width": mini ? 1.75 : 2.5, "stroke-linejoin": "round", "stroke-linecap": "round",
      ...(run[0].kind === "est" ? { "stroke-dasharray": "1 4" } : {}),
    }));
  };
  vis.forEach((p, i) => {
    if (run.length && run.at(-1).kind !== p.kind) { flush(); run = [run.at(-1)]; run[0] = { ...run[0], kind: p.kind }; }
    run.push(p);
  });
  flush();
  if (proj.length) plot.append(el("path", { d: path(proj), fill: "none", stroke: color, "stroke-width": mini ? 1.5 : 2, "stroke-dasharray": "6 5", opacity: 0.9 }));
  svg.append(plot);

  // now line + dot
  const nx = X(data.now);
  svg.append(el("line", { x1: nx, x2: nx, y1: m.t - (mini ? 0 : 14), y2: H - m.b + (mini ? 0 : 10), stroke: "var(--text-muted)", "stroke-width": 1 }));
  if (!mini) { const tx = el("text", { x: nx, y: m.t - 18, "text-anchor": "middle", fill: "var(--text-secondary)", "font-size": 12 }); tx.textContent = "Now"; svg.append(tx); }
  if (vis.length) svg.append(el("circle", { cx: nx, cy: Y(vis.at(-1).v), r: mini ? 4 : 6, fill: color, stroke: "var(--surface-1)", "stroke-width": 2 }));

  // reset labels
  if (labels) {
    const marks = jumps(vis, 15).concat(jumps(proj, 15)).filter((j) => j.t >= x0 && j.t <= x1);
    // resets close together stack their labels instead of dropping one
    let lastX = -1e9, lastY = 0;
    for (const j of marks.sort((a, b) => a.t - b.t)) {
      const x = Math.min(W - m.r - 18, Math.max(m.l + 18, X(j.t)));
      let y = Math.max(12, Y(j.v) - 10);
      if (x - lastX < 44) y = Math.min(y, lastY - 16);
      lastX = x; lastY = y;
      const tx = el("text", { x, y, "text-anchor": "middle", fill: "var(--text-secondary)", "font-size": 12 });
      tx.textContent = `+${Math.round(j.gain)}%`; svg.append(tx);
    }
  }

  // hover layer (shared time across all charts)
  const cross = el("line", { y1: m.t, y2: H - m.b, stroke: "var(--text-secondary)", "stroke-width": 1, "stroke-dasharray": "2 3", visibility: "hidden" });
  const dot = el("circle", { r: mini ? 3.5 : 5, fill: color, stroke: "var(--surface-1)", "stroke-width": 2, visibility: "hidden" });
  svg.append(cross, dot);
  const hit = el("rect", { x: m.l, y: 0, width: W - m.l - m.r, height: H, fill: "transparent" });
  svg.append(hit);
  container.append(svg);
  const tip = document.createElement("div"); tip.className = "tip"; container.append(tip);

  const valueAt = (t) => {
    const pts = t <= data.now ? hist : proj;
    let best = null;
    for (const p of pts) { if (p.t <= t) best = p; else break; }
    return best && { ...best, projected: t > data.now };
  };
  container._hover = (t) => {
    if (t == null) { cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); tip.style.display = "none"; return; }
    const p = valueAt(t);
    const x = X(t);
    cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.setAttribute("visibility", "visible");
    if (!p) { dot.setAttribute("visibility", "hidden"); tip.style.display = "none"; return; }
    dot.setAttribute("cx", x); dot.setAttribute("cy", Y(p.v)); dot.setAttribute("visibility", "visible");
    if (!container._owner) { tip.style.display = "none"; return; }
    const kind = p.projected ? "projected" : p.kind === "est" ? "estimated" : "recorded";
    let rows = `<div class="row"><span>${key === "pool" ? "Pool" : short(key)}</span><b>${fmtPct(p.v)}</b></div>`;
    if (key === "pool") {
      data.accounts.forEach((a, i) => {
        const s = seriesFor(a.email), pts = p.projected ? s.proj : s.hist;
        let v = null; for (const q of pts) { if (q.t <= t) v = q.v; else break; }
        if (v != null) rows += `<div class="row"><span><i class="sw" style="background:${COLORS[i % 3]}"></i>${short(a.email)}</span><span>${fmtPct(v)}</span></div>`;
      });
    }
    tip.innerHTML = `<div class="when">${fmtWhen(t)} · ${kind}</div>${rows}`;
    tip.style.display = "block";
    const left = x + 14 + tip.offsetWidth > W ? x - 14 - tip.offsetWidth : x + 14;
    tip.style.left = `${left}px`; tip.style.top = `${mini ? 0 : m.t}px`;
  };
  const toT = (ev) => {
    const r = svg.getBoundingClientRect();
    const px = ((ev.clientX - r.left) / r.width) * W;
    return x0 + ((px - m.l) / (W - m.l - m.r)) * (x1 - x0);
  };
  hit.addEventListener("pointermove", (ev) => { charts.forEach((c) => (c._owner = c === container)); setHover(toT(ev)); });
  hit.addEventListener("pointerleave", () => setHover(null));
  charts.push(container);
}

let charts = [];
function setHover(t) { hoverT = t; charts.forEach((c) => c._hover(t)); }

function render() {
  charts = [];
  const accts = data.accounts.filter((a) => a.active);
  const cap = data.capacity;
  const now = data.now;
  const poolNow = data.pool.at(-1);
  $("acct-count").textContent = `${accts.length} subscription${accts.length === 1 ? "" : "s"}`;
  $("hero").textContent = fmtPct(poolNow);
  $("hero-of").textContent = `of ${cap}% weekly left`;


  document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.days) === days)));

  const top = Math.ceil(Math.max(cap, ...data.pool.filter((v) => v != null)) / 100) * 100;
  drawChart($("pool-chart"), { key: "pool", height: 300, max: top, color: "var(--pool)", area: true, labels: true, ticksY: Array.from({ length: top / 100 + 1 }, (_, i) => i * 100) });

  // account cards
  const cards = $("cards"); cards.innerHTML = "";
  data.accounts.forEach((a, i) => {
    const color = COLORS[i % 3];
    const L = a.latest;
    const card = document.createElement("article"); card.className = "panel card";
    const util = L?.util ?? null;
    const remaining = L ? (L.reset && now >= L.reset ? 100 : 100 - util) : null;
    const reset = L?.reset ? (L.reset > now ? L.reset : L.reset + 7 * DAY) : null;
    let status = "";
    if (remaining != null && remaining <= (a.reserve || 0)) status = `<span class="status crit">● at reserve</span>`;
    else if (remaining != null && remaining < 20) status = `<span class="status warn">▲ low</span>`;
    card.innerHTML = `
      <h3><i class="sw" style="background:${color}"></i><span class="em" title="${a.email}">${short(a.email)}</span>${status}</h3>
      <div class="val">${fmtPct(remaining)} <small>${reset ? `resets in ${fmtIn(reset - now)}` : ""}</small></div>
      <div class="meter" title="weekly remaining"><i style="width:${remaining ?? 0}%;background:${color}"></i></div>`;

    cards.append(card);
  });
  if (hoverT != null) setHover(hoverT);
  renderThreads(); // account colors come from data
}

document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => {
  days = Number(b.dataset.days); localStorage.setItem("days", days); render();
}));
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => data && render(), 120); });
// recent threads: which account each session is bound to, polled every 5s
const LIVE = 90; // seconds since the last request for a thread to count as live
const esc = (v) => String(v).replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`);
function fmtAgo(sec) {
  if (sec < 60) return `${Math.max(0, Math.round(sec))}s ago`;
  if (sec < 3600) return `${Math.floor(sec / 60)}m ago`;
  return `${Math.floor(sec / 3600)}h ${Math.floor((sec % 3600) / 60)}m ago`;
}
function acctCell(name) {
  const i = data ? data.accounts.findIndex((a) => a.email === name) : -1;
  const sw = i >= 0 ? `<i class="sw" style="background:${COLORS[i % 3]}"></i>` : `<i class="sw" style="background:var(--surface-2)"></i>`;
  return `<span class="acct">${sw}${esc(name.includes("@") ? short(name) : name)}</span>`;
}
let threadData = null;
async function loadThreads() {
  try { threadData = await (await fetch("api/threads")).json(); } catch { return; }
  renderThreads();
}
function renderThreads() {
  if (!threadData) return;
  const now = threadData.now;
  const rows = threadData.threads;
  const live = rows.filter((t) => now - t.last < LIVE).length;
  $("threads-sub").textContent = live ? `${live} live` : "last 12h";
  if (!rows.length) { $("threads").innerHTML = `<div class="empty">No threads in the last 12h.</div>`; return; }
  $("threads").innerHTML = `<table>
    <tr><th></th><th>Thread</th><th>Account</th><th>Model</th><th class="num">Requests</th><th>Rerouted</th><th class="num">Last request</th></tr>
    ${rows.map((t) => {
      const isLive = now - t.last < LIVE;
      const mv = t.moves.at(-1);
      const moved = mv ? `<span class="move" title="${esc(t.moves.map((m) => `${fmtWhen(m.t)}: ${m.from} → ${m.to} (${m.why})`).join("\n"))}">from ${esc(mv.from.includes("@") ? short(mv.from) : mv.from)} ${fmtAgo(now - mv.t)}${t.moves.length > 1 ? ` · ${t.moves.length}×` : ""}</span>` : `<span class="muted">–</span>`;
      return `<tr class="${isLive ? "" : "idle"}">
        <td><span class="dot${isLive ? " live" : ""}"></span></td>
        <td class="id" title="${esc(t.id)}">${esc(t.id.split(":").pop())}</td>
        <td>${acctCell(t.account)}</td>
        <td>${esc(t.model.replace(/^claude-/, ""))}</td>
        <td class="num">${t.n}</td>
        <td>${moved}</td>
        <td class="num ago">${fmtAgo(now - t.last)}</td></tr>`;
    }).join("")}</table>`;
}
load();
setInterval(load, 60_000);
loadThreads();
setInterval(loadThreads, 5_000);
</script>
</body>
</html>
